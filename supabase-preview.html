<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = 'https://mkpcmsenppdbrcwshbil.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GlNSsExtk_BUXidKn1ckrw_hkktIDLJ';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function escapeHTML(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}


async function loadSite() {

  const status = document.getElementById('status');
  const app = document.getElementById('app');

  try {

const [
  areasResult,
  coursesResult,
  spotsResult,
  linksResult
] = await Promise.all([

      db
        .from('areas')
        .select('id,name,sort_order')
        .is('deleted_at', null)
        .order('sort_order'),

      db
        .from('public_courses')
        .select('*')
        .order('sort_order'),

      db
        .from('public_spots')
        .select('*'),

      db
        .from('public_course_spots')
        .select('*')
        .order('sort_order')

    ]);


    if (areasResult.error)
      throw areasResult.error;
    
    if (coursesResult.error)
      throw coursesResult.error;

    if (spotsResult.error)
      throw spotsResult.error;

    if (linksResult.error)
      throw linksResult.error;

    const areas = areasResult.data;
    const courses = coursesResult.data;
    const spots = spotsResult.data;
    const courseSpots = linksResult.data;


    const spotMap = new Map(
      spots.map(spot => [spot.id, spot])
    );

    const coursesByArea = new Map(
  areas.map(area => [
    area.id,
    courses.filter(
      course => course.area_id === area.id
    )
  ])
);

let courseCounter = 0;

app.innerHTML = areas.map(area => {

  const areaCourses =
    coursesByArea.get(area.id) ?? [];

  if (areaCourses.length === 0) {
    return '';
  }

  const courseHtml = areaCourses.map(course => {

    const courseIndex = courseCounter++;

    const memberships = courseSpots
      .filter(
        item =>
          item.course_id === course.id
      )
      .sort(
        (a, b) =>
          a.sort_order - b.sort_order
      );

    const cards = memberships.map(
      (membership, index) => {

        const spot =
          spotMap.get(membership.spot_id);

        if (!spot) return '';

        const links = [];

        if (spot.official_url) {
          links.push(
            `<a href="${escapeHTML(spot.official_url)}"
                target="_blank"
                rel="noopener">
                公式サイト
             </a>`
          );
        }

        if (spot.instagram_url) {
          links.push(
            `<a href="${escapeHTML(spot.instagram_url)}"
                target="_blank"
                rel="noopener">
                Instagram
             </a>`
          );
        }

        if (spot.x_url) {
          links.push(
            `<a href="${escapeHTML(spot.x_url)}"
                target="_blank"
                rel="noopener">
                X
             </a>`
          );
        }

        if (spot.facebook_url) {
          links.push(
            `<a href="${escapeHTML(spot.facebook_url)}"
                target="_blank"
                rel="noopener">
                Facebook
             </a>`
          );
        }

        if (spot.google_maps_url) {
          links.push(
            `<a href="${escapeHTML(spot.google_maps_url)}"
                target="_blank"
                rel="noopener">
                Google Maps
             </a>`
          );
        }

        if (spot.other_url) {
          links.push(
            `<a href="${escapeHTML(spot.other_url)}"
                target="_blank"
                rel="noopener">
                その他
             </a>`
          );
        }

        return `
          <article
            class="spot"
            draggable="true"
            data-course-id="${course.id}"
            data-spot-id="${spot.id}">

            <div class="spot-order">
              STOP ${String(index + 1).padStart(2, '0')}
            </div>

            <h3>
              ${escapeHTML(spot.name)}
            </h3>

            ${
              spot.genre
                ? `<div class="genre">
                     ${escapeHTML(spot.genre)}
                   </div>`
                : ''
            }

            ${
              spot.address
                ? `<p class="address">
                     ${escapeHTML(spot.address)}
                   </p>`
                : ''
            }

            ${
              spot.tel
                ? `<div class="meta">
                     TEL ${escapeHTML(spot.tel)}
                   </div>`
                : ''
            }

            ${
              spot.hours
                ? `<div class="meta">
                     営業時間 ${escapeHTML(spot.hours)}
                   </div>`
                : ''
            }

            ${
              spot.closed
                ? `<div class="meta">
                     定休日 ${escapeHTML(spot.closed)}
                   </div>`
                : ''
            }

            ${
              spot.parking
                ? `<p class="address">
                     駐車場 ${escapeHTML(spot.parking)}
                   </p>`
                : ''
            }

            ${
              spot.accessibility
                ? `<p class="address">
                     バリアフリー ${escapeHTML(spot.accessibility)}
                   </p>`
                : ''
            }

            ${
              spot.stay_duration
                ? `<p class="address">
                     滞在時間 ${escapeHTML(spot.stay_duration)}
                   </p>`
                : ''
            }

            ${
              spot.priority
                ? `<p class="address">
                     優先度 ${escapeHTML(spot.priority)}
                   </p>`
                : ''
            }

            ${
              spot.intro
                ? `<p class="intro">
                     ${escapeHTML(spot.intro)}
                   </p>`
                : ''
            }

            ${
              links.length
                ? `<div class="links">
                     ${links.join('')}
                   </div>`
                : ''
            }

            <button
              class="spot-edit-button"
              type="button"
              data-spot-id="${spot.id}">
              編集
            </button>

            <div class="spot-order-buttons">

              <button
                class="spot-move-up"
                type="button"
                data-course-id="${course.id}"
                data-spot-id="${spot.id}">
                ↑
              </button>

              <button
                class="spot-move-down"
                type="button"
                data-course-id="${course.id}"
                data-spot-id="${spot.id}">
                ↓
              </button>

            </div>

          </article>
        `;
      }
    ).join('');

    return `
      <section
        class="course"
        draggable="true"
        data-course-id="${course.id}">

        <div class="course-head">

          <div class="course-number">
            COURSE
            ${String(courseIndex + 1).padStart(2, '0')}
          </div>

          <h2>
            ${escapeHTML(course.name)}
          </h2>

          <button
            class="course-edit-button"
            type="button"
            data-course-id="${course.id}">
            コース編集
          </button>

          <div class="course-order-buttons">

            <button
              class="course-move-up"
              type="button"
              data-course-id="${course.id}">
              ↑

  ) {
    return;

  document

document.addEventListener('drop', async (event) => {

  const targetCard =
    event.target.closest('.spot');

  const draggingCard =
    document.querySelector('.spot.is-dragging');

  if (!targetCard || !draggingCard) return;

  if (targetCard === draggingCard) return;

  if (
    targetCard.dataset.courseId !==
    draggingCard.dataset.courseId
  ) {
    return;
  }

  event.preventDefault();

  const parent =
    targetCard.parentElement;

  const cards =
  Array.from(parent.querySelectorAll('.spot'));

const draggingIndex =
  cards.indexOf(draggingCard);

const targetIndex =
  cards.indexOf(targetCard);

if (draggingIndex < targetIndex) {

  parent.insertBefore(
    draggingCard,
    targetCard.nextSibling
  );

} else {

  parent.insertBefore(
    draggingCard,
    targetCard
  );
}

const orderedCards =
  Array.from(
    parent.querySelectorAll('.spot')
  );

for (let i = 0; i < orderedCards.length; i++) {

  const card = orderedCards[i];

  const result = await db
    .from('course_spots')
    .update({
      sort_order: i + 1
    })
    .eq('course_id', card.dataset.courseId)
    .eq('spot_id', card.dataset.spotId);

  if (result.error) {
    console.error(result.error);
    break;
  }
}
  
  targetCard.classList.remove('is-drop-target');
});

document.addEventListener('drop', async (event) => {

  const targetCourse =
    event.target.closest('.course');

  const draggingCourse =
    document.querySelector('.course.is-dragging');

  if (!targetCourse || !draggingCourse) return;

  if (targetCourse === draggingCourse) return;

  event.preventDefault();

  const parent =
    targetCourse.parentElement;

  const courses =
    Array.from(parent.querySelectorAll('.course'));

  const draggingIndex =
    courses.indexOf(draggingCourse);

  const targetIndex =
    courses.indexOf(targetCourse);

  if (draggingIndex < targetIndex) {

    parent.insertBefore(
      draggingCourse,
      targetCourse.nextSibling
    );

  } else {

    parent.insertBefore(
      draggingCourse,
      targetCourse
    );
  }

const orderedCourses =
  Array.from(
    parent.querySelectorAll('.course')
  );

for (let i = 0; i < orderedCourses.length; i++) {

  const course = orderedCourses[i];

  const result = await db
    .from('courses')
    .update({
      sort_order: i + 1
    })
    .eq('id', course.dataset.courseId);

  if (result.error) {
    console.error(result.error);
    break;
  }
}
  
  targetCourse.classList.remove('is-drop-target');
});
  
</script>

</body>
</html>
