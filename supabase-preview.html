<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>遠足候補2026｜Supabase Preview</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f1e9;
      color: #22251f;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    header {
      padding: 24px 28px;
      border-bottom: 1px solid #ddd9cc;
      background: #f7f5ee;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      color: #77786f;
      font-size: 13px;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 40px auto 80px;
    }

    #status {
      margin-bottom: 25px;
      font-size: 13px;
      color: #73766b;
    }

    .course {
      margin-bottom: 55px;
    }

    .course-head {
      margin-bottom: 18px;
    }

    .course-number {
      font-size: 11px;
      letter-spacing: .16em;
      color: #747969;
      font-weight: 700;
    }

    .course h2 {
      margin: 6px 0 4px;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 650;
    }

    .annotation {
      margin: 0;
      color: #6e7067;
      font-size: 14px;
    }

    .spots {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .spot {
      background: #fffefa;
      border: 1px solid #ddd9cc;
      border-radius: 18px;
      padding: 20px;
      min-height: 180px;
    }

    .spot-order {
      font-size: 11px;
      color: #8a8d82;
      letter-spacing: .1em;
    }

    .spot h3 {
      margin: 8px 0 12px;
      font-size: 20px;
    }

    .genre {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 11px;
      color: #68705d;
      border: 1px solid #d9ddcf;
      border-radius: 20px;
      padding: 4px 9px;
    }

    .address,
    .intro {
      font-size: 13px;
      line-height: 1.7;
      color: #676960;
      margin: 5px 0;
    }

    .links {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .links a {
      color: #293429;
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .error {
      color: #b42318 !important;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      main {
        width: min(100% - 24px, 1100px);
        margin-top: 28px;
      }

      .spots {
        grid-template-columns: 1fr;
      }
    }
 .edit-button {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 1000;

  border: 1px solid #d8d8d0;
  background: rgba(255,255,255,.92);
  color: #30332d;

  border-radius: 999px;
  padding: 8px 14px;

  font-size: 12px;
  cursor: pointer;
}

.login-panel {
  position: fixed;
  inset: 0;
  z-index: 2000;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(30,32,28,.32);
}

.login-panel.open {
  display: flex;
}

.login-box {
  width: min(360px, calc(100% - 32px));
  background: #fffefa;

  border: 1px solid #ddd9cc;
  border-radius: 18px;

  padding: 24px;
}

.login-box h2 {
  margin: 0 0 18px;
  font-size: 20px;
}

.login-box input {
  width: 100%;
  margin: 0 0 10px;
  padding: 12px;

  border: 1px solid #d6d5cd;
  border-radius: 10px;

  font: inherit;
}

.login-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.login-actions button {
  flex: 1;
  padding: 10px;

  border-radius: 10px;
  border: 1px solid #d6d5cd;

  cursor: pointer;
}

#login-submit {
  background: #262b24;
  color: white;
  border-color: #262b24;
}

#login-status {
  min-height: 20px;
  margin: 12px 0 0;

  font-size: 12px;
  color: #77786f;
}
.spot-edit-button {
  margin-top: 14px;
  padding: 7px 11px;

  border: 1px solid #d6d5cd;
  background: #f8f7f1;
  color: #30332d;

  border-radius: 999px;
  font-size: 11px;
  cursor: pointer;

  display: none;
}

body.is-editing .spot-edit-button {
  display: inline-block;
}
.spot-editor {
  position: fixed;
  inset: 0;
  z-index: 3000;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(30,32,28,.32);
}

.spot-editor.open {
  display: flex;
}

.spot-editor-box {
  width: min(520px, calc(100% - 32px));
  max-height: calc(100vh - 40px);
  overflow: auto;

  background: #fffefa;
  border: 1px solid #ddd9cc;
  border-radius: 18px;

  padding: 24px;
}

.spot-editor-box h2 {
  margin: 0 0 18px;
  font-size: 20px;
}

.spot-editor-box label {
  display: block;
  margin: 14px 0 5px;

  font-size: 12px;
  color: #696c63;
}

.spot-editor-box input,
.spot-editor-box textarea {
  width: 100%;
  padding: 11px 12px;

  border: 1px solid #d6d5cd;
  border-radius: 10px;

  font: inherit;
  background: white;
}

.spot-editor-box textarea {
  min-height: 100px;
  resize: vertical;
}

.spot-editor-actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.spot-editor-actions button {
  flex: 1;
  padding: 10px;

  border-radius: 10px;
  border: 1px solid #d6d5cd;
  cursor: pointer;
}

#spot-save {
  background: #262b24;
  color: white;
  border-color: #262b24;
} 
  </style>
</head>

<body>
<button id="edit-button" class="edit-button" type="button">
  編集
</button>

<div id="login-panel" class="login-panel">
  <div class="login-box">
    <h2>編集モード</h2>

    <input
      id="login-email"
      type="email"
      placeholder="メールアドレス"
      autocomplete="username"
    >

    <input
      id="login-password"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <div class="login-actions">
      <button id="login-cancel" type="button">
        キャンセル
      </button>

      <button id="login-submit" type="button">
        ログイン
      </button>
    </div>

    <p id="login-status"></p>
  </div>
</div>
<div id="spot-editor" class="spot-editor">
  <div class="spot-editor-box">

    <h2>スポット編集</h2>

    <input
      id="spot-edit-id"
      type="hidden"
    >

    <label for="spot-edit-name">
      名前
    </label>

    <input
      id="spot-edit-name"
      type="text"
    >

    <label for="spot-edit-address">
      住所
    </label>

    <input
      id="spot-edit-address"
      type="text"
    >

    <label for="spot-edit-genre">
      ジャンル
    </label>

    <input
      id="spot-edit-genre"
      type="text"
    >

    <label for="spot-edit-intro">
      紹介文
    </label>

    <textarea
      id="spot-edit-intro"
    ></textarea>

    <div class="spot-editor-actions">

      <button
        id="spot-cancel"
        type="button">
        キャンセル
      </button>

      <button
        id="spot-save"
        type="button">
        保存
      </button>

    </div>

    <p id="spot-edit-status"></p>

  </div>
</div>  
<header>
  <h1>遠足候補 2026</h1>
  <p>Supabase preview</p>
</header>

<main>
  <div id="status">Supabaseから読み込み中...</div>
  <div id="app"></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = 'https://mkpcmsenppdbrcwshbil.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GlNSsExtk_BUXidKn1ckrw_hkktIDLJ';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function escapeHTML(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}


async function loadSite() {

  const status = document.getElementById('status');
  const app = document.getElementById('app');

  try {

    const [
      coursesResult,
      spotsResult,
      linksResult
    ] = await Promise.all([

      db
        .from('public_courses')
        .select('*')
        .order('sort_order'),

      db
        .from('public_spots')
        .select('*'),

      db
        .from('public_course_spots')
        .select('*')
        .order('sort_order')

    ]);


    if (coursesResult.error)
      throw coursesResult.error;

    if (spotsResult.error)
      throw spotsResult.error;

    if (linksResult.error)
      throw linksResult.error;


    const courses = coursesResult.data;
    const spots = spotsResult.data;
    const courseSpots = linksResult.data;


    const spotMap = new Map(
      spots.map(spot => [spot.id, spot])
    );


    app.innerHTML = courses.map(
      (course, courseIndex) => {

        const memberships = courseSpots
          .filter(
            item =>
              item.course_id === course.id
          )
          .sort(
            (a, b) =>
              a.sort_order - b.sort_order
          );


        const cards = memberships.map(
          (membership, index) => {

            const spot =
              spotMap.get(membership.spot_id);

            if (!spot) return '';


            const links = [];

            if (spot.official_url) {
              links.push(
                `<a href="${escapeHTML(spot.official_url)}"
                    target="_blank"
                    rel="noopener">
                    公式サイト
                 </a>`
              );
            }

            if (spot.instagram_url) {
              links.push(
                `<a href="${escapeHTML(spot.instagram_url)}"
                    target="_blank"
                    rel="noopener">
                    Instagram
                 </a>`
              );
            }


            return `
              <article class="spot">

                <div class="spot-order">
                  STOP ${String(index + 1).padStart(2, '0')}
                </div>

                <h3>
                  ${escapeHTML(spot.name)}
                </h3>

                ${
                  spot.genre
                    ? `<div class="genre">
                         ${escapeHTML(spot.genre)}
                       </div>`
                    : ''
                }

                ${
                  spot.address
                    ? `<p class="address">
                         ${escapeHTML(spot.address)}
                       </p>`
                    : ''
                }

                ${
                  spot.intro
                    ? `<p class="intro">
                         ${escapeHTML(spot.intro)}
                       </p>`
                    : ''
                }

                ${
                  links.length
                    ? `<div class="links">
                         ${links.join('')}
                       </div>`
                    : ''
                }
${spot.name === 'ラ コリーナ近江八幡'
  ? `<button
       class="spot-edit-button"
       type="button"
       data-spot-id="${spot.id}">
       編集
     </button>`
  : ''
}
              </article>
            `;
          }
        ).join('');


        return `
          <section class="course">

            <div class="course-head">

              <div class="course-number">
                COURSE
                ${String(courseIndex + 1).padStart(2, '0')}
              </div>

              <h2>
                ${escapeHTML(course.name)}
              </h2>

              ${
                course.annotation
                  ? `<p class="annotation">
                       ${escapeHTML(course.annotation)}
                     </p>`
                  : ''
              }

            </div>

            <div class="spots">
              ${cards}
            </div>

          </section>
        `;
      }
    ).join('');


    status.textContent =
      `Supabaseから ${courses.length}コース・${spots.length}スポットを読み込みました。`;

  }

  catch (error) {

    console.error(error);

    status.className = 'error';

    status.textContent =
      '読み込みエラー：' + error.message;
  }
}


loadSite();
const editButton =
  document.getElementById('edit-button');

const loginPanel =
  document.getElementById('login-panel');

const loginCancel =
  document.getElementById('login-cancel');

const loginSubmit =
  document.getElementById('login-submit');

const loginEmail =
  document.getElementById('login-email');

const loginPassword =
  document.getElementById('login-password');

const loginStatus =
  document.getElementById('login-status');


editButton.addEventListener('click', async () => {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {
    editButton.textContent = '編集中';
    document.body.classList.add('is-editing');
    loginStatus.textContent =
      'ログイン済みです。';
    return;
  }

  loginPanel.classList.add('open');
});


loginCancel.addEventListener('click', () => {

  loginPanel.classList.remove('open');
  loginStatus.textContent = '';
});


loginSubmit.addEventListener('click', async () => {

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value;

  if (!email || !password) {
    loginStatus.textContent =
      'メールアドレスとパスワードを入力してください。';
    return;
  }

  loginSubmit.disabled = true;
  loginStatus.textContent =
    'ログイン中...';

  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });

  loginSubmit.disabled = false;

  if (error) {
    loginStatus.textContent =
      'ログインできませんでした：' +
      error.message;
    return;
  }

  if (data.session) {
    loginStatus.textContent =
      'ログインしました。';

    editButton.textContent = '編集中';
    document.body.classList.add('is-editing');
    setTimeout(() => {
      loginPanel.classList.remove('open');
    }, 500);
  }
});
const spotEditor =
  document.getElementById('spot-editor');

const spotEditId =
  document.getElementById('spot-edit-id');

const spotEditName =
  document.getElementById('spot-edit-name');

const spotEditAddress =
  document.getElementById('spot-edit-address');

const spotEditGenre =
  document.getElementById('spot-edit-genre');

const spotEditIntro =
  document.getElementById('spot-edit-intro');

const spotCancel =
  document.getElementById('spot-cancel');

const spotSave =
  document.getElementById('spot-save');

const spotEditStatus =
  document.getElementById('spot-edit-status');


document.addEventListener('click', async (event) => {

  const button =
    event.target.closest('.spot-edit-button');

  if (!button) return;

  const spotId =
    button.dataset.spotId;

  spotEditStatus.textContent =
    '読み込み中...';

  const {
    data,
    error
  } = await db
    .from('spots')
    .select('id,name,address,genre,intro')
    .eq('id', spotId)
    .single();

  if (error) {
    spotEditStatus.textContent =
      '読み込みエラー：' + error.message;
    return;
  }

  spotEditId.value =
    data.id;

  spotEditName.value =
    data.name ?? '';

  spotEditAddress.value =
    data.address ?? '';

  spotEditGenre.value =
    data.genre ?? '';

  spotEditIntro.value =
    data.intro ?? '';

  spotEditStatus.textContent = '';

  spotEditor.classList.add('open');
});


spotCancel.addEventListener('click', () => {

  spotEditor.classList.remove('open');
  spotEditStatus.textContent = '';
});
</script>

</body>
</html>
