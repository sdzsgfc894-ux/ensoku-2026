<script>

const SUPABASE_URL = 'https://mkpcmsenppdbrcwshbil.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GlNSsExtk_BUXidKn1ckrw_hkktIDLJ';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function escapeHTML(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}


async function loadSite() {

  const status = document.getElementById('status');
  const app = document.getElementById('app');

  try {

    const [
      coursesResult,
      spotsResult,
      linksResult
    ] = await Promise.all([

      db
        .from('public_courses')
        .select('*')
        .order('sort_order'),

      db
        .from('public_spots')
        .select('*'),

      db
        .from('public_course_spots')
        .select('*')
        .order('sort_order')

    ]);


    if (coursesResult.error)
      throw coursesResult.error;

    if (spotsResult.error)
      throw spotsResult.error;

    if (linksResult.error)
      throw linksResult.error;


    const courses = coursesResult.data;
    const spots = spotsResult.data;
    const courseSpots = linksResult.data;


    const spotMap = new Map(
      spots.map(spot => [spot.id, spot])
    );


    app.innerHTML = courses.map(
      (course, courseIndex) => {

        const memberships = courseSpots
          .filter(
            item =>
              item.course_id === course.id
          )
          .sort(
            (a, b) =>
              a.sort_order - b.sort_order
          );


        const cards = memberships.map(
          (membership, index) => {

            const spot =
              spotMap.get(membership.spot_id);

            if (!spot) return '';


            const links = [];

            if (spot.official_url) {
              links.push(
                `<a href="${escapeHTML(spot.official_url)}"
                    target="_blank"
                    rel="noopener">
                    公式サイト
                 </a>`
              );
            }

            if (spot.instagram_url) {
              links.push(
                `<a href="${escapeHTML(spot.instagram_url)}"
                    target="_blank"
                    rel="noopener">
                    Instagram
                 </a>`
              );
            }

           if (spot.x_url) {
             links.push(
               `<a href="${escapeHTML(spot.x_url)}"
                   target="_blank"
                   rel="noopener">
                   X
                </a>`
              );
            }
           
          if (spot.facebook_url) {
            links.push(
               `<a href="${escapeHTML(spot.facebook_url)}"
                   target="_blank"
                   rel="noopener">
                   Facebook
               </a>`
              );
            }
            
          if (spot.google_maps_url) {
            links.push(
              `<a href="${escapeHTML(spot.google_maps_url)}"
                  target="_blank"
                  rel="noopener">
                  Google Maps
              </a>`
             );
            }

         if (spot.other_url) {
           links.push(
             `<a href="${escapeHTML(spot.other_url)}"
               target="_blank"
              rel="noopener">
              その他
           </a>`
          );
         }

            return `
             <article
                class="spot"
                draggable="true"
                data-course-id="${course.id}"
                data-spot-id="${spot.id}">

                <div class="spot-order">
                  STOP ${String(index + 1).padStart(2, '0')}
                </div>

                <h3>
                  ${escapeHTML(spot.name)}
                </h3>

                ${
                  spot.genre
                    ? `<div class="genre">
                         ${escapeHTML(spot.genre)}
                       </div>`
                    : ''
                }

                ${
                  spot.address
                    ? `<p class="address">
                         ${escapeHTML(spot.address)}
                       </p>`
                    : ''
                }

                ${spot.tel
                  ? `<div class="meta">TEL ${escapeHTML(spot.tel)}</div>`
                    : ''
                }

                ${spot.hours
                  ? `<div class="meta">営業時間 ${escapeHTML(spot.hours)}</div>`
                    : ''
                }

                ${spot.closed
                  ? `<div class="meta">定休日 ${escapeHTML(spot.closed)}</div>`
                    : ''
                }

                ${spot.parking
                  ? `<p class="address">駐車場 ${escapeHTML(spot.parking)}</p>`
                    : ''
                }

                ${spot.accessibility
                  ? `<p class="address">バリアフリー ${escapeHTML(spot.accessibility)}</p>`
                    : ''
                }

                ${spot.stay_duration
                  ? `<p class="address">滞在時間 ${escapeHTML(spot.stay_duration)}</p>`
                    : ''
                }

                ${spot.priority
                  ? `<p class="address">優先度 ${escapeHTML(spot.priority)}</p>`
                    : ''
                }

                ${
                  spot.intro
                    ? `<p class="intro">
                         ${escapeHTML(spot.intro)}
                       </p>`
                    : ''
                }

                ${
                  links.length
                    ? `<div class="links">
                         ${links.join('')}
                       </div>`
                    : ''
                }
<button
  class="spot-edit-button"
  type="button"
  data-spot-id="${spot.id}">
  編集
</button>

<div class="spot-order-buttons">
  <button
    class="spot-move-up"
    type="button"
    data-course-id="${course.id}"
    data-spot-id="${spot.id}">
    ↑
  </button>

  <button
    class="spot-move-down"
    type="button"
    data-course-id="${course.id}"
    data-spot-id="${spot.id}">
    ↓
  </button>
</div>

              </article>
            `;
          }
        ).join('');


        return `
          <section class="course">

            <div class="course-head">

              <div class="course-number">
                COURSE
                ${String(courseIndex + 1).padStart(2, '0')}
              </div>

              <h2>
                ${escapeHTML(course.name)}
              </h2>

                 <button
                   class="course-edit-button"
                   type="button"
                   data-course-id="${course.id}">
                     コース編集
                  </button>

              ${
                course.annotation
                  ? `<p class="annotation">
                       ${escapeHTML(course.annotation)}
                     </p>`
                  : ''
              }

            </div>

            <div class="spots">
              ${cards}
            </div>

          </section>
        `;
      }
    ).join('');


    status.textContent =
      `Supabaseから ${courses.length}コース・${spots.length}スポットを読み込みました。`;

  }

  catch (error) {

    console.error(error);

    status.className = 'error';

    status.textContent =
      '読み込みエラー：' + error.message;
  }
}


loadSite();
const editButton =
  document.getElementById('edit-button');

const loginPanel =
  document.getElementById('login-panel');

const loginCancel =
  document.getElementById('login-cancel');

const loginSubmit =
  document.getElementById('login-submit');

const loginEmail =
  document.getElementById('login-email');

const loginPassword =
  document.getElementById('login-password');

const loginStatus =
  document.getElementById('login-status');


editButton.addEventListener('click', async () => {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {

  if (document.body.classList.contains('is-editing')) {
    document.body.classList.remove('is-editing');
    editButton.textContent = '編集';
    loginStatus.textContent = '';
    return;
  }

  editButton.textContent = '編集中';
  document.body.classList.add('is-editing');
  loginStatus.textContent =
    'ログイン済みです。';

  return;
}

  loginPanel.classList.add('open');
});


loginCancel.addEventListener('click', () => {

  loginPanel.classList.remove('open');
  loginStatus.textContent = '';
});


loginSubmit.addEventListener('click', async () => {

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value;

  if (!email || !password) {
    loginStatus.textContent =
      'メールアドレスとパスワードを入力してください。';
    return;
  }

  loginSubmit.disabled = true;
  loginStatus.textContent =
    'ログイン中...';

  const {
    data,
    error
  } = await db.auth.signInWithPassword({
    email,
    password
  });

  loginSubmit.disabled = false;

  if (error) {
    loginStatus.textContent =
      'ログインできませんでした：' +
      error.message;
    return;
  }

  if (data.session) {
    loginStatus.textContent =
      'ログインしました。';

    editButton.textContent = '編集中';
    document.body.classList.add('is-editing');
    setTimeout(() => {
      loginPanel.classList.remove('open');
    }, 500);
  }
});

spotSave.addEventListener('click', async () => {

  spotEditStatus.textContent = '保存中...';
  spotSave.disabled = true;

  const spotPayload = {
    name: spotEditName.value.trim(),
    address: spotEditAddress.value.trim(),
    tel: spotEditTel.value.trim(),
    hours: spotEditHours.value.trim(),
    closed: spotEditClosed.value.trim(),
    parking: spotEditParking.value.trim(),
    accessibility: spotEditAccessibility.value.trim(),
    stay_duration: spotEditStayDuration.value.trim(),
    priority: spotEditPriority.value || null,
    genre: spotEditGenre.value.trim(),
    intro: spotEditIntro.value.trim(),

    official_url: spotEditOfficial.value.trim(),
    instagram_url: spotEditInstagram.value.trim(),
    reservation_url: spotEditReservation.value.trim(),
    facebook_url: spotEditFacebook.value.trim(),
    x_url: spotEditX.value.trim(),
    google_maps_url: spotEditGoogleMaps.value.trim(),
    other_url: spotEditOtherUrl.value.trim(),

    updated_at: new Date().toISOString()
  };

  let error;

  if (editingSpotId) {

    const result = await db
      .from('spots')
      .update(spotPayload)
      .eq('id', editingSpotId);

    error = result.error;

  } else {

  const result = await db
    .from('spots')
    .insert({
      ...spotPayload,
      created_at: new Date().toISOString()
    })
    .select('id')
    .single();

  error = result.error;

  if (!error && spotEditCourse.value) {

    const courseSpotResult = await db
      .from('course_spots')
      .insert({
        course_id: spotEditCourse.value,
        spot_id: result.data.id,
        sort_order: 999,
        route_included: true
      });

    error = courseSpotResult.error;
  }
}
  if (error) {

    spotEditStatus.textContent =
      '保存エラー：' + error.message;

    spotSave.disabled = false;
    return;
  }

  spotEditStatus.textContent =
    editingSpotId ? '保存しました' : 'スポットを追加しました';

  await loadSite();

  setTimeout(() => {

    spotEditor.classList.remove('open');
    spotEditStatus.textContent = '';
    spotSave.disabled = false;

  }, 500);
});

document.addEventListener('click', async (event) => {

  const moveButton =
    event.target.closest('.spot-move-up, .spot-move-down');

  if (!moveButton) return;

  const courseId =
    moveButton.dataset.courseId;

  const spotId =
    moveButton.dataset.spotId;

  const direction =
    moveButton.classList.contains('spot-move-up')
      ? 'up'
      : 'down';

const { data: courseSpots, error } = await db
  .from('course_spots')
  .select('spot_id,sort_order')
  .eq('course_id', courseId)
  .order('sort_order');

if (error) {
  console.error(error);
  return;
}

console.log(courseSpots);

const currentIndex =
  courseSpots.findIndex(item => item.spot_id === spotId);

if (currentIndex === -1) return;

const targetIndex =
  direction === 'up'
    ? currentIndex - 1
    : currentIndex + 1;

if (
  targetIndex < 0 ||
  targetIndex >= courseSpots.length
) {
  return;
}

const currentItem =
  courseSpots[currentIndex];

const targetItem =
  courseSpots[targetIndex];

const currentOrder =
  currentItem.sort_order;

const targetOrder =
  targetItem.sort_order;

const firstUpdate = await db
  .from('course_spots')
  .update({
    sort_order: targetOrder
  })
  .eq('course_id', courseId)
  .eq('spot_id', currentItem.spot_id);

if (firstUpdate.error) {
  console.error(firstUpdate.error);
  return;
}

const secondUpdate = await db
  .from('course_spots')
  .update({
    sort_order: currentOrder
  })
  .eq('course_id', courseId)
  .eq('spot_id', targetItem.spot_id);

if (secondUpdate.error) {
  console.error(secondUpdate.error);
  return;
}

await loadSite();
  
  console.log({
    courseId,
    spotId,
    direction
  });
});

document.addEventListener('dragstart', (event) => {

  const card =
    event.target.closest('.spot');

  if (!card) return;

  card.classList.add('is-dragging');
});

document.addEventListener('dragend', (event) => {

  const card =
    event.target.closest('.spot');

  if (!card) return;

  card.classList.remove('is-dragging');

  document
    .querySelectorAll('.spot.is-drop-target')
    .forEach(item => {
      item.classList.remove('is-drop-target');
    });
});

document.addEventListener('dragover', (event) => {

  const targetCard =
    event.target.closest('.spot');

  const draggingCard =
    document.querySelector('.spot.is-dragging');

  if (!targetCard || !draggingCard) return;

  if (targetCard === draggingCard) return;

  if (
    targetCard.dataset.courseId !==
    draggingCard.dataset.courseId
  ) {
    return;
  }

  event.preventDefault();

  document
    .querySelectorAll('.spot.is-drop-target')
    .forEach(item => {
      item.classList.remove('is-drop-target');
    });

  targetCard.classList.add('is-drop-target');
});

document.addEventListener('drop', async (event) => {

  const targetCard =
    event.target.closest('.spot');

  const draggingCard =
    document.querySelector('.spot.is-dragging');

  if (!targetCard || !draggingCard) return;

  if (targetCard === draggingCard) return;

  if (
    targetCard.dataset.courseId !==
    draggingCard.dataset.courseId
  ) {
    return;
  }

  event.preventDefault();

  const parent =
    targetCard.parentElement;

  const cards =
  Array.from(parent.querySelectorAll('.spot'));

const draggingIndex =
  cards.indexOf(draggingCard);

const targetIndex =
  cards.indexOf(targetCard);

if (draggingIndex < targetIndex) {

  parent.insertBefore(
    draggingCard,
    targetCard.nextSibling
  );

} else {

  parent.insertBefore(
    draggingCard,
    targetCard
  );
}

const orderedCards =
  Array.from(
    parent.querySelectorAll('.spot')
  );

for (let i = 0; i < orderedCards.length; i++) {

  const card = orderedCards[i];

  const result = await db
    .from('course_spots')
    .update({
      sort_order: i + 1
    })
    .eq('course_id', card.dataset.courseId)
    .eq('spot_id', card.dataset.spotId);

  if (result.error) {
    console.error(result.error);
    break;
  }
}
  
  targetCard.classList.remove('is-drop-target');
});
